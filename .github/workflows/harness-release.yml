name: Harness Release
on:
  pull_request:
    paths: ["harness/**", "plugins/**", ".agents/**", ".goose/recipes/**", "scripts/**", "evals/**", ".github/workflows/harness-release.yml"]
  push:
    tags: ["harness-v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - uses: pnpm/action-setup@v4
        with: {version: "10.33.0"}
      - uses: oven-sh/setup-bun@v2
        with: {bun-version: "1.3.12"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --requirement requirements-ci.txt
      - name: Install native workspace dependencies
        working-directory: apps
        run: pnpm install --frozen-lockfile
        env:
          npm_config_node_gyp: ${{ github.workspace }}/apps/node_modules/node-gyp/bin/node-gyp.js
      - run: pnpm --dir apps --filter @harness/eval-hub build
      - run: python3 -m unittest discover -s scripts/tests/integration -p 'test_*.py'
      - name: Verify reproducible harness bundle
        shell: bash
        run: |
          version="0.0.0-ci.${GITHUB_RUN_ID}"
          if [[ "$GITHUB_REF" == refs/tags/harness-v* ]]; then
            version="${GITHUB_REF_NAME#harness-v}"
          fi
          python3 scripts/ci-harness-release.py --version "$version" --output dist/harness-ci --dry-run-publish
      - uses: actions/upload-artifact@v4
        with:
          name: harness-release-linux-x86_64
          path: dist/harness-ci/release/**
  publish:
    if: startsWith(github.ref, 'refs/tags/harness-v')
    needs: verify
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@v4
        with: {name: harness-release-linux-x86_64, path: release}
      - run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
