name: Documentation (PR verification and automatic main publication)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish after target confirmation and Pages/environment setup
        type: boolean
        default: false
      site_url:
        description: Optional absolute site base URL ending in / (otherwise Pages metadata or project URL)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: documentation-pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check publication prerequisites
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          ENABLED: ${{ vars.PAGES_DEPLOY_ENABLED }}
          CONFIRMED_REPOSITORY: ${{ vars.PAGES_REPOSITORY }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$ENABLED" = true
          test "$CONFIRMED_REPOSITORY" = "$REPOSITORY"
          test "$REF" = "refs/heads/$DEFAULT_BRANCH"
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Read existing Pages configuration
        id: pages
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: false
      - name: Install documentation dependencies
        run: python -m pip install --requirement website/requirements.txt
      - name: Verify source contracts
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s website/tests -v
      - name: Resolve site and source URLs
        env:
          PUBLISH: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
          REQUESTED_URL: ${{ inputs.site_url }}
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          requested = os.environ['REQUESTED_URL']
          pages = os.environ['PAGES_URL']
          owner = os.environ['REPOSITORY_OWNER']
          name = os.environ['REPOSITORY'].split('/', 1)[1]
          fallback = f'https://{owner}.github.io/'
          if name.lower() != f'{owner.lower()}.github.io':
              fallback += name + '/'
          if os.environ['PUBLISH'] == 'true':
              if not pages:
                  raise ValueError('Existing Pages URL is required for publication')
              if requested and requested != pages.rstrip('/') + '/':
                  raise ValueError('Publication URL override must match existing Pages metadata')
          site = requested or (pages.rstrip('/') + '/' if pages else fallback)
          from website.build import validate_url
          site = validate_url(site, base=True)
          repository = validate_url(os.environ['SERVER_URL'] + '/' + os.environ['REPOSITORY'])
          with Path(os.environ['GITHUB_ENV']).open('a') as env:
              print(f'SITE_URL={site}', file=env)
              print(f'REPO_URL={repository}', file=env)
          PY
      - name: Build both locales with the pinned strict builder
        run: python website/build.py --output .site --base-url "$SITE_URL" --repo-url "$REPO_URL"
      - name: Upload only generated documentation
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: .site
          retention-days: 1

  deploy:
    if: >-
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)) &&
      vars.PAGES_DEPLOY_ENABLED == 'true' &&
      vars.PAGES_REPOSITORY == github.repository &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy generated Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
