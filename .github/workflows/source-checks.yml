name: Develop source checks

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        description: Exact source commit to verify
        required: false
        type: string

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact source head without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Verify feature pull requests target develop
        if: github.event_name == 'pull_request'
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: test "$BASE_BRANCH" = develop
      - name: Prepare diagnostic output outside candidate inputs
        run: mkdir -p "$RUNNER_TEMP/ci-logs"
      - name: Check source contracts and handler behavior
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/ci-logs/source.log"
      - name: Check contained operational inventory
        shell: bash
        run: |
          set -euo pipefail
          python -B tests/payload_inventory.py . 2>&1 | tee "$RUNNER_TEMP/ci-logs/inventory.log"
      - name: Build and verify committed-source candidate
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/production.py candidate "$RUNNER_TEMP/product" 2>&1 | tee "$RUNNER_TEMP/ci-logs/candidate.log"
          python -B tools/production.py verify "$RUNNER_TEMP/product" 2>&1 | tee "$RUNNER_TEMP/ci-logs/verify.log"
          python -B tools/production.py smoke "$RUNNER_TEMP/product" 2>&1 | tee "$RUNNER_TEMP/ci-logs/smoke.log"
      - name: Retain verification diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-ci-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-logs
          retention-days: 14
          if-no-files-found: ignore
